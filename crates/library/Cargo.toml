[package]
name = "procera-library"
description = "Governed library: artifacts, immutable versions, lifecycle state machine, reviews with separation of duties, scheduled publication (BPMS-040, FR-G04/G05)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
procera-audit.workspace = true
procera-db.workspace = true
procera-kernel.workspace = true
procera-settings.workspace = true
serde = { workspace = true }
serde_jcs = "0.2"
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "time", "macros"] }
thiserror.workspace = true
time = { workspace = true }
uuid.workspace = true

[dev-dependencies]
proptest.workspace = true
anyhow.workspace = true
tokio.workspace = true
procera-db = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
