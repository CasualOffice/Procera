[package]
name = "procera-db"
description = "PostgreSQL access: migrations, workspace-scoped transactions with RLS context, outbox and idempotency (docs/04 §2.2, §2.11, §3)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Helpers that create a throwaway database per test run (needs PROCERA_TEST_DATABASE_URL, superuser).
test-support = []

[dependencies]
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "time", "migrate", "macros"] }
procera-kernel.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
time.workspace = true
sha2 = "0.10"

[dev-dependencies]
anyhow.workspace = true
procera-db = { path = ".", features = ["test-support"] }

[lints]
workspace = true
