[package]
name = "procera-sso"
description = "OpenID Connect single sign-on, the relying party (BPMS-140): per-workspace provider settings, PKCE sign-in, ID token verification and identity linking."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
jsonwebtoken = { version = "9.3", default-features = false }
procera-crypto.workspace = true
procera-db.workspace = true
procera-keys.workspace = true
procera-kernel.workspace = true
procera-webhooks.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
serde = { workspace = true }
serde_json.workspace = true
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "json", "time", "macros"] }
thiserror.workspace = true
time = { workspace = true }
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true
