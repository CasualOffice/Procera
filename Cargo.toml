[workspace]
resolver = "3"
# Layout follows docs/04-LLD.md §1. Crates are added by the tracker item that needs them;
# do not add empty placeholder crates.
members = ["crates/kernel", "crates/crypto", "crates/cache", "crates/db", "crates/audit", "crates/identity", "crates/access", "crates/members",
    "crates/settings",
    "crates/notify", "crates/keys",
    "crates/library", "crates/campaigns", "crates/announcements", "crates/search", "crates/platform", "apps/procera", "conformance"]
# Phase-0 spikes live in their own workspace and are never part of the product build.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/CasualOffice/Procera"
rust-version = "1.98"
publish = false

[workspace.dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
procera-kernel = { path = "crates/kernel" }
procera-cache = { path = "crates/cache" }
procera-db = { path = "crates/db" }
procera-audit = { path = "crates/audit" }
procera-crypto = { path = "crates/crypto" }
procera-identity = { path = "crates/identity" }
procera-platform = { path = "crates/platform" }
procera-access = { path = "crates/access" }
procera-members = { path = "crates/members" }
procera-settings = { path = "crates/settings" }
procera-notify = { path = "crates/notify" }
procera-keys = { path = "crates/keys" }
procera-library = { path = "crates/library" }
procera-campaigns = { path = "crates/campaigns" }
procera-announcements = { path = "crates/announcements" }
procera-search = { path = "crates/search" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Password hashing is deliberately expensive; keep debug/test builds usable.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Lean dev builds: line tables for our crates (backtraces keep file:line), no debug info for
# dependencies. Keeps target/ small enough for several worktrees at once.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
