name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    services:
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PROCERA_TEST_CACHE_URL: redis://127.0.0.1:6379
      PROCERA_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Release build excludes test-only features (docs/24 §5.4)
        run: cargo build --release -p procera

  licence-gate:
    name: licence & advisory gate (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-cyclonedx --locked --version 0.5.9
      - run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "**/*.cdx.json"

  e2e-smoke:
    name: E2E API packs (P0 smoke + R1 auth) + release has no test controls
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Validate E2E compose stack
        run: docker compose -f deploy/compose.e2e.yml config -q
      - name: Build e2e and release binaries
        run: |
          cargo build -p procera --features e2e
          cp target/debug/procera /tmp/procera-e2e
          cargo build --release -p procera
      - name: Release binary must not expose /__test/* (docs/24 §5.4)
        run: |
          PROCERA_BIND=127.0.0.1:18081 target/release/procera serve --all &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:18081/healthz && break; sleep 0.2; done
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/__test/clock)
          echo "release /__test/clock -> $code"; test "$code" = "404"
      - name: Prepare e2e database (roles, migrations) and start e2e server
        run: |
          psql postgres://postgres@127.0.0.1:5432/postgres -qc "CREATE DATABASE procera_e2e"
          psql postgres://postgres@127.0.0.1:5432/procera_e2e -q -f deploy/sql/00-roles.sql
          /tmp/procera-e2e migrate --migrator-url postgres://procera_migrator@127.0.0.1:5432/procera_e2e
          export PROCERA_DATABASE_URL=postgres://procera_app@127.0.0.1:5432/procera_e2e
          export PROCERA_MASTER_KEY="$(/tmp/procera-e2e keygen 2>/dev/null)"
          export PROCERA_INSECURE_COOKIES=true
          export PROCERA_LOGIN_RATE_PER_MIN=10000
          PROCERA_BIND=127.0.0.1:18080 /tmp/procera-e2e serve --all > /tmp/procera-e2e.log 2>&1 &
          for i in $(seq 1 50); do curl -fs http://127.0.0.1:18080/healthz && break; sleep 0.2; done
      - name: Run E2E API packs
        working-directory: e2e
        env:
          PROCERA_BASE_URL: http://127.0.0.1:18080
        run: |
          npm ci --no-audit --no-fund
          npm run lint:no-sleeps
          npx playwright test --project api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
            /tmp/procera-e2e.log

  web:
    name: web · tokens · contrast · types · build · JS licence gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: JS licence gate (all lockfiles)
        run: node scripts/js-licence-gate.mjs
      - working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  e2e-a11y:
    name: E2E accessibility (design system, chromium)
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Serve built web app
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run preview > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:14173/ && break; sleep 0.5; done
      - name: Run axe / keyboard / reflow / target-size checks
        working-directory: e2e
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          npx playwright test --project chromium-desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-a11y-report
          path: |
            e2e/playwright-report
            e2e/test-results
