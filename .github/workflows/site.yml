name: site

# Builds the marketing site (site/, standard-library Python) and publishes it to GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/build_tracker.py"
      - "assets/brand/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" comes from the tracker's commit history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          SITE_URL: https://casualoffice.github.io/Procera
        run: python3 site/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
