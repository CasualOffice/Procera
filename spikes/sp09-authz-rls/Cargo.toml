[package]
name = "sp09-authz-rls"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cedar-policy = { version = "4.13", features = ["partial-eval"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "macros"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v7"] }
rand = "0.9"
anyhow = "1"
