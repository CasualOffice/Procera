<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="Procera home">
      <img class="light" src="assets/brand/procera-logo-horizontal.svg" alt="Procera" width="210" height="64">
      <img class="dark" src="assets/brand/procera-logo-horizontal-dark.svg" alt="Procera" width="210" height="64">
    </a>
    <nav class="nav" aria-label="Main">{{ nav }}</nav>
    <div class="header-actions">
      <button class="theme-toggle" type="button" aria-label="Switch theme" aria-pressed="false">{{ icon sun }}{{ icon moon }}</button>
      <a class="btn btn-primary btn-sm btn-gh" href="{{ gh }}">{{ icon github }}<span>GitHub</span><span class="sr-only"> (Procera repository)</span></a>
      <details class="menu">
        <summary aria-label="Menu">{{ icon menu }}</summary>
        <nav aria-label="Main (mobile)">{{ nav }}</nav>
      </details>
    </div>
  </div>
</header>
