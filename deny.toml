# Licence and supply-chain gate (ADR-0014, docs/24 §3.12). CI fails on violation.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path crates (publish = false) are not wildcards in practice.
allow-wildcard-paths = true
highlight = "simplest-path"

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Permissive only. AGPL, GPL, LGPL (linked), SSPL, BSL/BUSL, SUL and Commons-Clause are never allowed.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
