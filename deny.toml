# Licence and supply-chain gate (ADR-0014, docs/24 §3.12). CI fails on violation.
[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path crates (publish = false) are not wildcards in practice.
allow-wildcard-paths = true
highlight = "simplest-path"

[licenses]
version = 2
confidence-threshold = 0.93
unused-allowed-license = "allow"
# Permissive only. AGPL, GPL, LGPL (linked), SSPL, BUSL-1.1 (Business Source), SUL and Commons-Clause
# are never allowed. NOTE: "BSL-1.0" is the *Boost* Software License (permissive, OSI) — allowed below.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MIT-0",
    "0BSD", # public-domain-equivalent; on the SP-07 allow list (e.g. quoted_printable via lettre)
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0", # Boost Software License (NOT Business Source); e.g. xxhash-rust via redis
    # Mozilla CA root bundle (webpki-root-certs) is distributed under this permissive data licence.
    # Needed for TLS to IdPs, SMTP relays and webhooks. Reviewed in SP-07.
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
