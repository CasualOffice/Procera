[package]
name = "procera"
description = "Procera server and admin CLI (api, worker, scheduler run from this one binary; docs/03 §3)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "procera"
path = "src/main.rs"

[features]
# Test-only controls (/__test/*) for the E2E harness. MUST NOT be enabled in release builds
# (docs/23 §4, docs/24 §5.4). CI verifies the endpoints return 404 in the release binary.
e2e = ["procera-kernel/test-clock"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64 = "0.22"
clap.workspace = true
procera-kernel.workspace = true
procera-cache.workspace = true
procera-db.workspace = true
procera-identity.workspace = true
procera-platform.workspace = true
procera-members.workspace = true
procera-access.workspace = true
procera-settings.workspace = true
procera-notify.workspace = true
procera-processes.workspace = true
procera-library.workspace = true
procera-keys.workspace = true
procera-files.workspace = true
procera-campaigns.workspace = true
procera-announcements.workspace = true
procera-search.workspace = true
procera-audit.workspace = true
procera-crypto.workspace = true
procera-engine.workspace = true
procera-requests.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true

uuid.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "uuid"] }
rust_xlsxwriter = "0.99"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
calamine = "0.36"
procera-db = { workspace = true, features = ["test-support"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[lints]
workspace = true
